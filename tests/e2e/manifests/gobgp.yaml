apiVersion: v1
kind: ConfigMap
metadata:
  name: gobgp-config
  namespace: pathosd-e2e
data:
  run.sh: |
    #!/bin/sh
    set -eu
    peer_host="pathosd-bgp.pathosd-e2e.svc.cluster.local"
    peer_ip=""
    i=0
    while [ -z "${peer_ip}" ] && [ "$i" -lt 120 ]; do
      peer_ip="$(getent ahosts "${peer_host}" 2>/dev/null | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/ {print $1; exit}')"
      i=$((i+1))
      [ -z "${peer_ip}" ] && sleep 1
    done
    if [ -z "${peer_ip}" ]; then
      echo "timed out resolving pathosd peer ${peer_host}" >&2
      exit 1
    fi
    sed "s/__PATHOSD_PEER__/${peer_ip}/g" /config/gobgpd.toml > /run/gobgpd.toml
    exec gobgpd -f /run/gobgpd.toml --api-hosts :50051
  gobgpd.toml: |
    [global.config]
    as = 65400
    router-id = "10.200.0.3"

    # Passive peer: pathosd dials gobgp (like FRR). Carries both IPv4 and IPv6
    # unicast so the e2e can verify received routes via the GoBGP gRPC API
    # (unlike BIRD, GoBGP accepts routes with unreachable next-hops, so the IPv6
    # route is stored in the RIB).
    [[neighbors]]
    [neighbors.config]
      neighbor-address = "__PATHOSD_PEER__"
      peer-as = 65100
    [neighbors.transport.config]
      passive-mode = true
    [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
    [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-unicast"
---
apiVersion: v1
kind: Pod
metadata:
  name: gobgp
  namespace: pathosd-e2e
  labels:
    app: gobgp
spec:
  containers:
    - name: gobgp
      image: gobgp:e2e
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/config/run.sh"]
      ports:
        - name: bgp
          containerPort: 179
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
      readinessProbe:
        tcpSocket:
          port: 179
        initialDelaySeconds: 2
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
      volumeMounts:
        - name: gobgp-config
          mountPath: /config
  volumes:
    - name: gobgp-config
      configMap:
        name: gobgp-config
---
apiVersion: v1
kind: Service
metadata:
  name: gobgp
  namespace: pathosd-e2e
  labels:
    app: gobgp
spec:
  clusterIP: None
  # Publish endpoints while initializing so pathosd's wait-gobgp init can
  # resolve gobgp's IP before it is Ready.
  publishNotReadyAddresses: true
  selector:
    app: gobgp
  ports:
    - name: bgp
      protocol: TCP
      port: 179
      targetPort: 179
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051