name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel runs on the main branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go mod verify / tidy
        run: |
          go mod verify
          go mod tidy -diff || \
            (echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result" && exit 1)

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go generate
        run: go generate ./...

      - name: Validate schema is up to date
        run: |
          git diff --exit-code schema/ || \
            (echo "Schema is out of date — run 'make generate' and commit the result" && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: go test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Pinned like every action; bump deliberately. Human-readable report
      # (never fails the job on its own).
      - name: govulncheck report
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || true

      # Gate on symbol-level ("affecting") findings only, minus known-stale
      # vulndb entries:
      #   GO-2026-4736 — GoBGP NEXT_HOP DoS (CVE-2026-30405). Fixed upstream in
      #   gobgp 583080a (v4.4.0+), but the Go vulndb entry lists no fixed
      #   version for the v4 module, so govulncheck flags every v4 release.
      #   Drop the exclusion once https://github.com/golang/vulndb corrects it.
      - name: govulncheck gate
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... > govulncheck.json
          jq -r -s '
            [ .[] | .finding? // empty
              | select(.trace[0].function != null)
              | .osv ]
            | unique
            | map(select(. != "GO-2026-4736"))
            | .[]' govulncheck.json | tee affecting.txt
          if [ -s affecting.txt ]; then
            echo "::error::govulncheck found vulnerabilities reachable from pathosd (see above)"
            exit 1
          fi
