schema = "v1"

[router]
asn = 65001
router_id = "10.0.0.1"
# local_address is the IPv4 peer source / IPv4 route next-hop.
local_address = "127.0.0.1"
# local_address_ipv6 is the IPv6 next-hop for IPv6 VIP routes. Required when
# any VIP prefix is IPv6; separate from local_address so IPv4 and IPv6 can
# coexist.
local_address_ipv6 = "2001:db8::1"

[api]
listen = "127.0.0.1:59179"
# Server timeouts (0 disables). write_timeout must exceed the longest check.timeout.
# read_header_timeout = "10s"
# read_timeout = "30s"
# write_timeout = "60s"
# idle_timeout = "120s"

[logging]
level = "info"
format = "text"
# otel_level = "debug"  # send debug records to OTEL while keeping console at "info"
# timestamps = true     # default: off under journald (it stamps records itself), on elsewhere

# OpenTelemetry export — traces, metrics and logs via OTLP.
# Transport is inferred from the URL scheme:
#   grpc://host:4317   gRPC plaintext    grpcs://host:4317  gRPC TLS
#   http://host:4318   OTLP/HTTP         https://host:4318  OTLP/HTTP TLS
# Set enabled = false (or remove endpoint) to disable entirely.
# Kernel filesystem locations, node-exporter style. Only the listen check
# reads them. In a container: -v /proc:/host/proc:ro and procfs = "/host/proc".
# [paths]
# procfs = "/proc"

[otel]
endpoint = "grpc://otel-collector.example.com:4317"
# enabled = false
insecure = false
service_name = "pathosd"
# [otel.headers]
# x-honeycomb-team = "MY_API_KEY"

# Per-signal overrides (all optional — inherit global values when absent):
# [otel.traces]
# enabled = false

# [otel.metrics]
# endpoint = "http://prometheus-remote.example.com:4318"
# [otel.metrics.headers]
# x-scope-orgid = "my-tenant"

# [otel.logs]
# insecure = true

[bgp]
graceful_restart = true
hold_time = "90s"
keepalive_time = "30s"
listen_address = "127.0.0.1"
listen_port = 1179

[bgp.gobgp_api]
enabled = false
# listen = "127.0.0.1:50051"

[[bgp.neighbors]]
name = "frr-local"
address = "127.0.0.2"
peer_asn = 65000
required = true
port = 179
local_address = "127.0.0.1"
passive = false
# TCP MD5 session signature (RFC 2385); must match the peer's password.
# auth_password = "shared-secret"   # better: an env placeholder, see README "Environment Placeholders"

# BFD for rapid failure detection (requires a BFD daemon, e.g. FRR bfdd).
# [bgp.neighbors.bfd]
# enabled = true
# desired_minimum_tx_interval = 300000  # 300 ms in µs
# required_minimum_receive = 300000     # 300 ms in µs
# detection_multiplier = 3

# HTTP health check — full URL form
[[vips]]
name = "web-frontend"
prefix = "10.10.1.1/32"
# require_local_address = true   # fail the check while 10.10.1.1 is not configured on this host
# local_interface = "dummy-vip"  # ... on this interface specifically

  [vips.check]
  type = "http"
  interval = "2s"
  timeout = "500ms"
  rise = 3
  fall = 3
  # detailed_metrics = true  # export status code and TLS cert expiry for this VIP

    [vips.check.http]
    url = "https://web.example.com/healthz"
    response_codes = [200]
    # keep_alive = true  # reuse the TLS connection between checks (default: new connection per check)

  [vips.policy]
  fail_action = "withdraw"

# HTTP health check — path-only with JQ response match
# Several checks on one VIP. Each check has its own interval/timeout/rise/fall;
# checks_policy combines their health: all (default), any, or a boolean
# expression over the check names (expr-lang syntax). Names default to the
# type and must be unique within the VIP.
[[vips]]
name = "web-multi"
prefix = "10.10.1.9/32"
checks_policy = "web || (dns && ping)"

  [[vips.checks]]
  name = "web"
  type = "http"
  interval = "2s"
  timeout = "500ms"

    [vips.checks.http]
    url = "https://web.example.com/healthz"

  [[vips.checks]]
  type = "dns"
  interval = "10s"
  timeout = "2s"

    [vips.checks.dns]
    names = ["web.example.com."]

  [[vips.checks]]
  type = "ping"

    [vips.checks.ping]
    privileged = false

  [vips.policy]
  fail_action = "withdraw"

[[vips]]
name = "api-backend"
prefix = "10.10.1.2/32"

  [vips.check]
  type = "http"
  interval = "3s"
  timeout = "1s"
  rise = 2
  fall = 3

    [vips.check.http]
    url = "/readyz"
    proto = "https"
    tls_insecure = true
    response_jq = ".ready == true"

  [vips.policy]
  fail_action = "withdraw"

# HTTP check — full URL with TLS cert verification via CA and curl --resolve
# semantics: connects to the VIP IP while verifying the cert against the
# hostname. tls_server_name defaults to the URL hostname automatically when
# the URL contains a non-IP hostname and host/port resolve to the VIP IP.
[[vips]]
name = "s3-backend"
prefix = "10.10.1.3/32"

  [vips.check]
  type = "http"
  interval = "10s"
  timeout = "5s"
  rise = 3
  fall = 3

    [vips.check.http]
    url = "https://s3.example.com/"
    response_codes = [200]
    tls_ca_cert = "/etc/pathosd/ca.crt"
    # tls_server_name = "s3.example.com"  # auto-defaulted from URL; set to override

  [vips.policy]
  fail_action = "withdraw"

# HTTP check through a forward HTTP(S) proxy (e.g. Squid). The proxy is what
# resolves and connects to the origin, so url must be a full URL and the
# origin target is the URL hostname (host defaults to it, not the VIP IP).
# user:pass@ in proxy is supported and sent as Proxy-Authorization. Use this
# to verify a proxy is working as part of a VIP's health.
[[vips]]
name = "proxy-check"
prefix = "10.10.1.4/32"

  [vips.check]
  type = "http"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.http]
    url = "https://httpbin.org/get"
    proxy = "http://proxy.example:3128"
    response_codes = [200]

  [vips.policy]
  fail_action = "withdraw"

# DNS health check — resolver defaults to VIP IP
[[vips]]
name = "dns-resolver"
prefix = "10.10.2.1/32"

  [vips.check]
  type = "dns"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 5

    [vips.check.dns]
    names = ["example.com", "test.example.com"]
    query_type = "A"

  [vips.policy]
  fail_action = "lower_priority"
  lower_priority_file = "/etc/pathosd/dns-resolver.drain"

    # Base attributes for every announcement of this VIP. A non-zero
    # as_path_prepend ranks this node below a node announcing the same VIP
    # with a smaller value (standby ordering); it is added to the
    # lower_priority prepend when pessimized so the order never inverts.
    [vips.policy.announce]
    as_path_prepend = 0
    communities = ["65001:100"]

    [vips.policy.lower_priority]
    as_path_prepend = 6 # pessimized AS_PATH carries 0 + 6 extra hops
    communities = ["65001:666"] # merged with announce.communities when pessimized

# Ping health check
[[vips]]
name = "gateway-check"
prefix = "10.10.3.1/32"

  [vips.check]
  type = "ping"
  interval = "1s"
  timeout = "800ms"
  rise = 1
  fall = 3

    [vips.check.ping]
    dst_ip = "10.0.0.1"
    privileged = false # true = raw ICMP, requires root/CAP_NET_RAW
    count = 3
    timeout = "500ms"
    interval = "100ms"
    max_loss_ratio = 0.5

  [vips.policy]
  fail_action = "withdraw"

# TCP port reachability check
# (host defaults to VIP IP for /32 prefix)
[[vips]]
name = "tcp-service"
prefix = "10.10.4.1/32"

  [vips.check]
  type = "tcp"
  interval = "3s"
  timeout = "1s"
  rise = 2
  fall = 3

    [vips.check.tcp]
    port = 8080
    # host = "10.10.4.1"  # explicit host override

  [vips.policy]
  fail_action = "withdraw"

# UDP port reachability check — sends a probe datagram and waits for ICMP
# port-unreachable (ECONNREFUSED) to detect a closed port.
# (host defaults to VIP IP for /32 prefix)
[[vips]]
name = "udp-service"
prefix = "10.10.5.1/32"

  [vips.check]
  type = "udp"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.udp]
    port = 514
    # payload = "<191>pathosd probe"   # probe payload; default is a single null byte ("\u0000")
    # host = "10.10.5.1" # explicit host override

  [vips.policy]
  fail_action = "withdraw"

# gRPC health check — standard gRPC Health Checking Protocol
# (grpc.health.v1.Health/Check). Passes when the server responds SERVING.
# host defaults to VIP IP for /32 prefix.
# SQL check — MySQL/MariaDB or PostgreSQL. Each query must succeed; with
# result_jq its rows (a JSON array of {column: value}) must make the
# expression true. Replication lag or read-only state are just queries.
[[vips]]
name = "mariadb-primary"
prefix = "10.10.8.1/32"

  [vips.check]
  type = "sql"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.sql]
    driver = "mysql"          # mysql | postgres; port defaults to 3306 / 5432
    user = "pathosd"
    password = "%{DB_PASSWORD}"
    # database = "app"
    # tls = true
    # tls_ca_cert = "/etc/pathosd/db-ca.crt"
    # keep_alive = true       # reuse the connection instead of reconnecting each check

    [[vips.check.sql.queries]]
    sql = "SELECT 1"

    [[vips.check.sql.queries]]
    name = "writable"
    sql = "SELECT @@read_only AS read_only"
    result_jq = ".[0].read_only == 0"

  [vips.policy]
  fail_action = "withdraw"

# Kafka check — connects to the broker (TLS/SASL as configured) and asks
# for metadata; optionally a topic must exist with a leader per partition.
[[vips]]
name = "kafka"
prefix = "10.10.9.1/32"

  [vips.check]
  type = "kafka"
  interval = "5s"
  timeout = "3s"
  rise = 2
  fall = 3

    [vips.check.kafka]
    port = 9092                # host defaults to the VIP IP
    # tls = true
    # tls_ca_cert = "/etc/pathosd/kafka-ca.crt"
    # topic = "events"         # must exist with a leader for every partition
    # min_brokers = 3

    [vips.check.kafka.sasl]
    mechanism = "scram-sha-512" # plain | scram-sha-256 | scram-sha-512
    user = "pathosd"
    password = "%{KAFKA_PASSWORD}"

  [vips.policy]
  fail_action = "withdraw"

# Listening-socket check — passes when a local socket is bound to the port
# (TCP LISTEN or any bound UDP socket) without sending anything. Use it for
# collectors that log every stray datagram (IPFIX, syslog, SNMP traps).
# Only sees pathosd's own network namespace.
[[vips]]
name = "ipfix-collector"
prefix = "10.10.7.1/32"

  [vips.check]
  type = "listen"
  interval = "5s"
  timeout = "1s"

    [vips.check.listen]
    proto = "udp"
    port = 4739
    # host = "10.10.7.1"  # default: VIP address; wildcard binds (0.0.0.0, ::) match too
    # netns_pid = 1      # host network namespace from a container (needs paths.procfs = "/host/proc")

  [vips.policy]
  fail_action = "withdraw"

[[vips]]
name = "grpc-service"
prefix = "10.10.6.1/32"

  [vips.check]
  type = "grpc"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.grpc]
    port = 50051
    # service = "myapp.v1.API"  # empty = server-wide health check

  [vips.policy]
  fail_action = "withdraw"

# gRPC custom method — calls any unary RPC with an empty proto3 request.
# Passes when the response gRPC status code is in ok_codes (default: ["OK"]).
# This mirrors the HTTP checker's response_codes semantics.
[[vips]]
name = "grpc-custom"
prefix = "10.10.6.2/32"

  [vips.check]
  type = "grpc"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.grpc]
    host = "myservice.internal"
    port = 9090
    method = "myapp.v1.Health/Ping"  # calls this unary RPC with an empty proto3 request
    ok_codes = ["OK"]                # gRPC status codes considered healthy
    tls = true
    tls_ca_cert = "/etc/pathosd/ca.crt"
    # tls_server_name = "myservice.internal"  # override SNI if needed

    [vips.check.grpc.metadata]
    x-api-token = "example-token"   # gRPC request metadata (like HTTP headers)

  [vips.policy]
  fail_action = "withdraw"

# IPv6 VIP — dual-stack support. The route is announced over IPv6 unicast
# (MP-BGP) with the router's IPv6 local_address as the next-hop. Because the
# router_id is always IPv4, announcing an IPv6 VIP requires router.local_address
# to be an IPv6 address. IPv6 unicast AFI/SAFI is enabled on peers automatically
# when at least one IPv6 VIP is configured.
[[vips]]
name = "ipv6-vip"
prefix = "2001:db8::1/128"

  [vips.check]
  type = "tcp"
  interval = "5s"
  timeout = "2s"
  rise = 2
  fall = 3

    [vips.check.tcp]
    host = "2001:db8::10"
    port = 443

  [vips.policy]
  fail_action = "withdraw"
