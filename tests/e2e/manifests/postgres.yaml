apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pathosd-e2e
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: pathosd
            - name: POSTGRES_PASSWORD
              value: e2e-pathosd
            - name: POSTGRES_DB
              value: e2e
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pathosd", "-d", "e2e"]
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pathosd-e2e
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
