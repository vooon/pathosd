# /etc/systemd/system/pathosd.service.d/dummy-vip.conf
# Start pathosd only after systemd-networkd has configured the dummy-vip
# interface, so the VIPs exist before the first health check runs.
# Wants= (not Requires=) keeps pathosd starting even if the interface is
# missing; wait-online then gives up after its timeout (120s by default).
[Unit]
Wants=systemd-networkd-wait-online@dummy-vip.service
After=systemd-networkd-wait-online@dummy-vip.service
