apiVersion: v1
kind: ConfigMap
metadata:
  name: bird-config
  namespace: pathosd-e2e
data:
  run.sh: |
    #!/bin/sh
    set -eu
    mkdir -p /run/bird
    peer_host="pathosd-bgp.pathosd-e2e.svc.cluster.local"
    peer_ip=""
    i=0
    while [ -z "${peer_ip}" ] && [ "$i" -lt 120 ]; do
      peer_ip="$(getent ahosts "${peer_host}" 2>/dev/null | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/ {print $1; exit}')"
      i=$((i+1))
      [ -z "${peer_ip}" ] && sleep 1
    done
    if [ -z "${peer_ip}" ]; then
      echo "timed out resolving pathosd peer ${peer_host}" >&2
      exit 1
    fi
    sed "s/__PATHOSD_PEER__/${peer_ip}/g" /config/bird.conf.tmpl > /run/bird/bird.conf
    exec /usr/sbin/bird -f -c /run/bird/bird.conf
  bird.conf.tmpl: |
    log stderr all;
    router id 10.200.0.2;

    protocol device {
    }

    # BIRD drops BGP routes whose next hop is not resolvable. The IPv6 routes
    # from pathosd use next hop 2001:db8:42::1 (a documentation address that is
    # not actually routed), so install a static reject route for that prefix to
    # make the next hop reachable for BGP validation.
    protocol static {
        ipv6;
        route 2001:db8:42::/64 reject;
    }

    # Active peer toward pathosd (pathosd is passive for this session). The TCP
    # transport is IPv4, but the session negotiates IPv6 unicast (MP-BGP) so it
    # carries the IPv6 VIP routes. FRR covers the IPv4 side.
    protocol bgp pathosd {
        local as 65300;
        neighbor __PATHOSD_PEER__ as 65100;
        ipv6 { import all; export all; };
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: bird
  namespace: pathosd-e2e
  labels:
    app: bird
spec:
  containers:
    - name: bird
      image: bird3:e2e
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "/config/run.sh"]
      ports:
        - name: bgp
          containerPort: 179
          protocol: TCP
      readinessProbe:
        exec:
          command: ["/usr/sbin/birdc", "-s", "/run/bird/bird.ctl", "show", "status"]
        initialDelaySeconds: 2
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
      volumeMounts:
        - name: bird-config
          mountPath: /config
  volumes:
    - name: bird-config
      configMap:
        name: bird-config
---
apiVersion: v1
kind: Service
metadata:
  name: bird
  namespace: pathosd-e2e
  labels:
    app: bird
spec:
  clusterIP: None
  # Publish endpoints while the pod is still initializing so pathosd's
  # wait-bird init can resolve bird's IP before the bird daemon is up.
  publishNotReadyAddresses: true
  selector:
    app: bird
  ports:
    - name: bgp
      protocol: TCP
      port: 179
      targetPort: 179