version: 2

project_name: pathosd

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: pathosd
    main: ./cmd/pathosd
    binary: pathosd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{.Version}}
      - -X github.com/prometheus/common/version.Revision={{.Commit}}
      - -X github.com/prometheus/common/version.BuildDate={{.Date}}
      - -X github.com/prometheus/common/version.Branch={{.Tag}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: pathosd-packages
    package_name: pathosd
    vendor: vooon
    homepage: https://github.com/vooon/pathosd
    maintainer: "pathosd contributors <pathosd@users.noreply.github.com>"
    description: |-
      Health-aware BGP VIP announcer.
      Announces VIPs via BGP (embedded GoBGP) based on configurable
      health check results (HTTP, DNS, TCP, UDP, gRPC, SQL, Kafka, ICMP ping).
    license: Apache 2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: net
    priority: optional
    scripts:
      preinstall: packaging/scripts/preinstall.sh
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    # The unit lives in /lib/systemd/system on Debian and in
    # /usr/lib/systemd/system on EL; everything else is shared. nfpm
    # overrides replace the whole key, hence two full lists.
    overrides:
      deb:
        dependencies:
          - systemd
        contents:
          - src: packaging/systemd/pathosd.service
            dst: /lib/systemd/system/pathosd.service
          - src: packaging/sysusers.d/pathosd.conf
            dst: /usr/lib/sysusers.d/pathosd.conf
          - src: packaging/tmpfiles.d/pathosd.conf
            dst: /usr/lib/tmpfiles.d/pathosd.conf
          - dst: /etc/pathosd
            type: dir
            file_info:
              mode: 0750
              owner: root
              group: pathosd
          # default config, not overwritten on upgrade
          - src: packaging/config/pathosd.toml
            dst: /etc/pathosd/pathosd.toml
            type: config|noreplace
      rpm:
        dependencies:
          - systemd
        contents:
          - src: packaging/systemd/pathosd.service
            dst: /usr/lib/systemd/system/pathosd.service
          - src: packaging/sysusers.d/pathosd.conf
            dst: /usr/lib/sysusers.d/pathosd.conf
          - src: packaging/tmpfiles.d/pathosd.conf
            dst: /usr/lib/tmpfiles.d/pathosd.conf
          - dst: /etc/pathosd
            type: dir
            file_info:
              mode: 0750
              owner: root
              group: pathosd
          - src: packaging/config/pathosd.toml
            dst: /etc/pathosd/pathosd.toml
            type: config|noreplace
    rpm:
      summary: Health-aware BGP VIP announcer
      group: System Environment/Daemons

checksum:
  name_template: "checksums.txt"

# SPDX SBOM per archive and package (syft), uploaded with the release.
sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

# Keyless (Sigstore) signature of the checksum file, which covers every
# archive and package. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/vooon/pathosd/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksums
    cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: checksum

# Keyless signature of every pushed image manifest, by digest.
docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "--yes"
      - "${artifact}@${digest}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

dockers:
  - image_templates:
      - "ghcr.io/vooon/pathosd:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: amd64
  - image_templates:
      - "ghcr.io/vooon/pathosd:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/vooon/pathosd:{{ .Version }}"
    image_templates:
      - "ghcr.io/vooon/pathosd:{{ .Version }}-amd64"
      - "ghcr.io/vooon/pathosd:{{ .Version }}-arm64"
  - name_template: "ghcr.io/vooon/pathosd:latest"
    image_templates:
      - "ghcr.io/vooon/pathosd:{{ .Version }}-amd64"
      - "ghcr.io/vooon/pathosd:{{ .Version }}-arm64"
