# MariaDB primary + streaming replica, each with a pathosd sidecar that
# announces the read-write VIP only from the primary and the read-only VIP
# from every pod that serves reads. See the ConfigMap for the conditions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-pathosd-config
  namespace: pathosd-e2e
data:
  pathosd.yaml: |
    schema: v1
    router:
      asn: 65100
      router_id: "%{POD_IPV4}"
      local_address: "%{POD_IPV4}"
    api:
      listen: ":59179"
    logging:
      level: debug
      format: text
    bgp:
      hold_time: 30s
      keepalive_time: 10s
      neighbors:
        - name: frr
          address: "%{FRR_PEER_IP}"
          peer_asn: 65200
          required: true
          port: 179
          auth_password: pathosd-e2e-md5
    # The same config runs on the primary and on the replica. Which VIPs a
    # pod announces follows from what its own server reports:
    #   mysql-rw: only where @@read_only is 0 (the primary)
    #   mysql-ro: wherever queries are answered and, on a replica, the SQL
    #             thread applies the relay log (reads keep working while the
    #             primary is unreachable, so only the SQL thread is required)
    vips:
      - name: mysql-rw
        prefix: 10.100.11.1/32
        check:
          type: sql
          interval: 2s
          timeout: 1s
          rise: 2
          fall: 2
          detailed_metrics: true
          sql:
            driver: mysql
            host: 127.0.0.1
            user: pathosd
            password: "%{E2E_DB_PASSWORD}"
            database: e2e
            queries:
              - name: writable
                sql: SELECT @@read_only AS read_only
                result_jq: ".[0].read_only == 0"
        policy:
          fail_action: withdraw
      - name: mysql-ro
        prefix: 10.100.11.2/32
        check:
          type: sql
          interval: 2s
          timeout: 1s
          rise: 2
          fall: 2
          detailed_metrics: true
          sql:
            driver: mysql
            host: 127.0.0.1
            user: pathosd
            password: "%{E2E_DB_PASSWORD}"
            database: e2e
            queries:
              - sql: SELECT 1
              - name: replication
                sql: SHOW REPLICA STATUS
                # No row on the primary; on a replica the SQL thread must run.
                result_jq: '(.[0] // {}) | (.Slave_SQL_Running // "Yes") == "Yes"'
        policy:
          fail_action: withdraw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-initdb
  namespace: pathosd-e2e
data:
  # SHOW REPLICA STATUS needs REPLICA MONITOR; the grant replicates to the
  # replica together with the user.
  grants.sql: |
    GRANT REPLICA MONITOR ON *.* TO 'pathosd'@'%';
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-primary
  namespace: pathosd-e2e
  labels:
    app: mariadb
    role: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
      role: primary
  template:
    metadata:
      labels:
        app: mariadb
        role: primary
    spec:
      initContainers:
        - name: wait-frr
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              peer_host="frr.pathosd-e2e.svc.cluster.local"
              i=0
              while :; do
                peer_ip="$(nslookup "${peer_host}" 2>/dev/null | awk '/^Address([[:space:]]+[0-9]+)?:/ {print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)"
                if [ -n "${peer_ip}" ]; then
                  printf '%s\n' "${peer_ip}" > /work/frr-peer-ip
                  exit 0
                fi
                i=$((i+1))
                if [ "$i" -ge 120 ]; then
                  echo "timed out waiting for frr bgp endpoint" >&2
                  exit 1
                fi
                sleep 1
              done
          volumeMounts:
            - name: runtime-data
              mountPath: /work
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.4
          imagePullPolicy: IfNotPresent
          args: ["--log-bin", "--server-id=1", "--binlog-format=ROW"]
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: e2e-root
            - name: MARIADB_USER
              value: pathosd
            - name: MARIADB_PASSWORD
              value: e2e-pathosd
            - name: MARIADB_DATABASE
              value: e2e
            # The image creates the replication user on the primary and runs
            # CHANGE MASTER on a replica started with MARIADB_MASTER_HOST.
            - name: MARIADB_REPLICATION_USER
              value: repl
            - name: MARIADB_REPLICATION_PASSWORD
              value: e2e-repl
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
        # pathosd runs next to the database, exactly as on a real DB host:
        # the checks go to 127.0.0.1 and the pod peers with FRR itself.
        - name: pathosd
          image: pathosd:e2e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              export POD_IPV4="${POD_IP}"
              export FRR_PEER_IP="$(cat /work/frr-peer-ip)"
              exec /usr/local/bin/pathosd run --config /etc/pathosd/pathosd.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: E2E_DB_PASSWORD
              value: e2e-pathosd
          ports:
            - containerPort: 59179
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 59179
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: pathosd-config
              mountPath: /etc/pathosd
            - name: runtime-data
              mountPath: /work
      volumes:
        - name: pathosd-config
          configMap:
            name: mariadb-pathosd-config
        - name: runtime-data
          emptyDir: {}
        - name: initdb
          configMap:
            name: mariadb-initdb
---
# Headless: resolves straight to the pod IP. Port 59179 is the sidecar's
# API, used by the e2e test to trigger checks on a specific pod.
apiVersion: v1
kind: Service
metadata:
  name: mariadb-primary
  namespace: pathosd-e2e
  labels:
    app: mariadb
    role: primary
spec:
  clusterIP: None
  selector:
    app: mariadb
    role: primary
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: http
      port: 59179
      targetPort: 59179
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-replica
  namespace: pathosd-e2e
  labels:
    app: mariadb
    role: replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
      role: replica
  template:
    metadata:
      labels:
        app: mariadb
        role: replica
