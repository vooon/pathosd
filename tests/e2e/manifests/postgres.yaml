# PostgreSQL primary + streaming standby, each with a pathosd sidecar that
# announces the read-write VIP only from the primary and the read-only VIP
# from every pod that serves reads. See the ConfigMap for the conditions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-pathosd-config
  namespace: pathosd-e2e
data:
  pathosd.yaml: |
    schema: v1
    router:
      asn: 65100
      router_id: "%{POD_IPV4}"
      local_address: "%{POD_IPV4}"
    api:
      listen: ":59179"
    logging:
      level: debug
      format: text
    bgp:
      hold_time: 30s
      keepalive_time: 10s
      neighbors:
        - name: frr
          address: "%{FRR_PEER_IP}"
          peer_asn: 65200
          required: true
          port: 179
          auth_password: pathosd-e2e-md5
    # Same config on primary and replica; the server state decides:
    #   pg-rw: only where pg_is_in_recovery() is false (the primary)
    #   pg-ro: wherever queries are answered and replay has caught up with
    #          the WAL received (always true on the primary)
    vips:
      - name: pg-rw
        prefix: 10.100.12.1/32
        check:
          type: sql
          interval: 2s
          timeout: 1s
          rise: 2
          fall: 2
          detailed_metrics: true
          sql:
            driver: postgres
            host: 127.0.0.1
            user: pathosd
            password: "%{E2E_DB_PASSWORD}"
            database: e2e
            queries:
              - name: primary
                sql: SELECT pg_is_in_recovery() AS in_recovery
                result_jq: ".[0].in_recovery == false"
        policy:
          fail_action: withdraw
      - name: pg-ro
        prefix: 10.100.12.2/32
        check:
          type: sql
          interval: 2s
          timeout: 1s
          rise: 2
          fall: 2
          detailed_metrics: true
          sql:
            driver: postgres
            host: 127.0.0.1
            user: pathosd
            password: "%{E2E_DB_PASSWORD}"
            database: e2e
            queries:
              - sql: SELECT 1
              - name: caught_up
                sql: SELECT pg_last_wal_receive_lsn() IS NOT DISTINCT FROM pg_last_wal_replay_lsn() AS caught_up
                result_jq: ".[0].caught_up"
        policy:
          fail_action: withdraw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: pathosd-e2e
data:
  # The image only opens pg_hba for "host all"; the standby also needs the
  # replication pseudo-database.
  replication.sh: |
    #!/bin/sh
    set -eu
    echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
  namespace: pathosd-e2e
  labels:
    app: postgres
    role: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      role: primary
  template:
    metadata:
      labels:
        app: postgres
        role: primary
    spec:
      initContainers:
        - name: wait-frr
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              peer_host="frr.pathosd-e2e.svc.cluster.local"
              i=0
              while :; do
                peer_ip="$(nslookup "${peer_host}" 2>/dev/null | awk '/^Address([[:space:]]+[0-9]+)?:/ {print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)"
                if [ -n "${peer_ip}" ]; then
                  printf '%s\n' "${peer_ip}" > /work/frr-peer-ip
                  exit 0
                fi
                i=$((i+1))
                if [ "$i" -ge 120 ]; then
                  echo "timed out waiting for frr bgp endpoint" >&2
                  exit 1
                fi
                sleep 1
              done
          volumeMounts:
            - name: runtime-data
              mountPath: /work
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: pathosd
            - name: POSTGRES_PASSWORD
              value: e2e-pathosd
            - name: POSTGRES_DB
              value: e2e
            # Subdirectory so the data dir gets 0700 regardless of the volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pathosd", "-d", "e2e"]
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
        # pathosd runs next to the database, exactly as on a real DB host:
        # the checks go to 127.0.0.1 and the pod peers with FRR itself.
        - name: pathosd
          image: pathosd:e2e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              export POD_IPV4="${POD_IP}"
              export FRR_PEER_IP="$(cat /work/frr-peer-ip)"
              exec /usr/local/bin/pathosd run --config /etc/pathosd/pathosd.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: E2E_DB_PASSWORD
              value: e2e-pathosd
          ports:
            - containerPort: 59179
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 59179
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: pathosd-config
              mountPath: /etc/pathosd
            - name: runtime-data
              mountPath: /work
      volumes:
        - name: pathosd-config
          configMap:
            name: postgres-pathosd-config
        - name: runtime-data
          emptyDir: {}
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: data
          emptyDir: {}
---
# Headless: resolves straight to the pod IP. Port 59179 is the sidecar's
# API, used by the e2e test to trigger checks on a specific pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: pathosd-e2e
  labels:
    app: postgres
    role: primary
spec:
  clusterIP: None
  selector:
    app: postgres
    role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: http
      port: 59179
      targetPort: 59179
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-replica
  namespace: pathosd-e2e
  labels:
    app: postgres
    role: replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      role: replica
  template:
    metadata:
      labels:
        app: postgres
        role: replica
    spec:
      initContainers:
        - name: wait-frr
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              peer_host="frr.pathosd-e2e.svc.cluster.local"
              i=0
              while :; do
                peer_ip="$(nslookup "${peer_host}" 2>/dev/null | awk '/^Address([[:space:]]+[0-9]+)?:/ {print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1 || true)"
                if [ -n "${peer_ip}" ]; then
                  printf '%s\n' "${peer_ip}" > /work/frr-peer-ip
                  exit 0
                fi
                i=$((i+1))
                if [ "$i" -ge 120 ]; then
                  echo "timed out waiting for frr bgp endpoint" >&2
                  exit 1
                fi
                sleep 1
              done
          volumeMounts:
            - name: runtime-data
              mountPath: /work
        # pg_basebackup -R writes standby.signal and primary_conninfo, so the
        # regular image entrypoint then starts a streaming standby.
        - name: basebackup
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 70
            runAsGroup: 70
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_basebackup -h postgres-primary.pathosd-e2e.svc.cluster.local -U pathosd -D "$PGDATA" -R -X stream -c fast; do
                echo "primary not ready, retrying" >&2
                sleep 2
              done
          env:
            - name: PGPASSWORD
              value: e2e-pathosd
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              value: e2e-pathosd
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pathosd", "-d", "e2e"]
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        # pathosd runs next to the database, exactly as on a real DB host:
        # the checks go to 127.0.0.1 and the pod peers with FRR itself.
        - name: pathosd
          image: pathosd:e2e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              export POD_IPV4="${POD_IP}"
              export FRR_PEER_IP="$(cat /work/frr-peer-ip)"
              exec /usr/local/bin/pathosd run --config /etc/pathosd/pathosd.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: E2E_DB_PASSWORD
              value: e2e-pathosd
          ports:
            - containerPort: 59179
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 59179
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: pathosd-config
              mountPath: /etc/pathosd
            - name: runtime-data
              mountPath: /work
      volumes:
        - name: pathosd-config
          configMap:
            name: postgres-pathosd-config
        - name: runtime-data
          emptyDir: {}
        - name: data
          emptyDir: {}
---
# Headless: resolves straight to the pod IP. Port 59179 is the sidecar's
# API, used by the e2e test to trigger checks on a specific pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: pathosd-e2e
  labels:
    app: postgres
    role: replica
spec:
  clusterIP: None
  selector:
    app: postgres
    role: replica
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: http
      port: 59179
      targetPort: 59179
