            - |
              set -eu
              export POD_IPV4="${POD_IP}"
              export FRR_PEER_IP="$(cat /work/frr-peer-ip)"
              exec /usr/local/bin/pathosd run --config /etc/pathosd/pathosd.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: E2E_DB_PASSWORD
              value: e2e-pathosd
          ports:
            - containerPort: 59179
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 59179
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          volumeMounts:
            - name: pathosd-config
              mountPath: /etc/pathosd
            - name: runtime-data
              mountPath: /work
      volumes:
        - name: pathosd-config
          configMap:
            name: mariadb-pathosd-config
        - name: runtime-data
          emptyDir: {}
---
